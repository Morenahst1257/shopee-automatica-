
name: Robo Shopee

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  executar-robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar robo
        run: python ofertas.py
